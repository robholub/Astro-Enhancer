name: Generate Play Store Icon & Feature Graphic

on:
  workflow_dispatch:

jobs:
  generate_assets:
    name: Generate Play Store Graphics
    runs-on: ubuntu-latest
    steps:
      - name: Generate 512x512 Icon & 1024x500 Feature Graphic
        run: |
          node -e '
          const fs = require("fs");
          const zlib = require("zlib");
          fs.mkdirSync("store-assets", { recursive: true });

          const crcTable = new Uint32Array(256);
          for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            crcTable[n] = c;
          }
          function crc32(buf) {
            let c = 0xffffffff;
            for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
            return (c ^ 0xffffffff) >>> 0;
          }
          function chunk(type, data) {
            const t = Buffer.from(type);
            const len = Buffer.alloc(4); len.writeUInt32BE(data.length);
            const crc = Buffer.alloc(4); crc.writeUInt32BE(crc32(Buffer.concat([t, data])));
            return Buffer.concat([len, t, data, crc]);
          }
          function writePngRGB(filepath, W, H, pixelFn) {
            // Color type 2 = 24-bit RGB (no alpha channel, required by Google Play Feature Graphic)
            const raw = Buffer.alloc((W * 3 + 1) * H);
            for (let y = 0; y < H; y++) {
              const row = y * (W * 3 + 1);
              raw[row] = 0;
              for (let x = 0; x < W; x++) {
                const [r, g, b] = pixelFn(x, y);
                const idx = row + 1 + x * 3;
                raw[idx] = r; raw[idx + 1] = g; raw[idx + 2] = b;
              }
            }
            const ihdr = Buffer.alloc(13);
            ihdr.writeUInt32BE(W, 0); ihdr.writeUInt32BE(H, 4);
            ihdr[8] = 8; ihdr[9] = 2;
            const png = Buffer.concat([
              Buffer.from([137,80,78,71,13,10,26,10]),
              chunk("IHDR", ihdr),
              chunk("IDAT", zlib.deflateSync(raw)),
              chunk("IEND", Buffer.alloc(0))
            ]);
            fs.writeFileSync(filepath, png);
          }

          function insideStar(x, y, cx, cy, rOuter, rInner) {
            const dx = Math.abs(x - cx), dy = Math.abs(y - cy);
            if (dx > rOuter || dy > rOuter) return false;
            return (dx / rOuter + dy / rInner <= 1) || (dx / rInner + dy / rOuter <= 1);
          }

          // 1. Play Store App Icon (512 x 512)
          writePngRGB("store-assets/play-store-icon-512x512.png", 512, 512, (x, y) => {
            const dist = Math.hypot(x - 256, y - 256) / 256;
            const neb = Math.max(0, 1 - dist);
            const neb2 = Math.max(0, 1 - Math.hypot(x - 275, y - 235) / 190);
            let r = Math.min(255, Math.round(7 + 28 * neb * neb + 45 * neb2 * neb2));
            let g = Math.min(255, Math.round(10 + 55 * neb * neb + 25 * neb2 * neb2));
            let b = Math.min(255, Math.round(18 + 125 * neb + 70 * neb2 * neb2));

            if (insideStar(x, y, 256, 256, 120, 17)) {
              return [248, 250, 252];
            }
            if (
              Math.hypot(x - 345, y - 165) <= 6.5 ||
              Math.hypot(x - 170, y - 335) <= 5 ||
              Math.hypot(x - 358, y - 328) <= 4.5
            ) {
              return [56, 189, 248];
            }
            return [r, g, b];
          });

          // 2. Play Store Feature Graphic (1024 x 500) - Deep-Sky Nebula & Starfield Banner
          const stars = [];
          let seed = 4219;
          function rand() {
            seed = (seed * 1664525 + 1013904223) >>> 0;
            return seed / 4294967296;
          }
          for (let i = 0; i < 240; i++) {
            stars.push({
              x: rand() * 1024,
              y: rand() * 500,
              rad: 0.7 + rand() * 1.9,
              tint: rand()
            });
          }

          writePngRGB("store-assets/play-store-feature-1024x500.png", 1024, 500, (x, y) => {
            // Diagonal emission & reflection nebula band across the 1024x500 canvas
            const nx = x / 1024, ny = y / 500;
            const band = Math.exp(-Math.pow((ny - (0.72 - 0.44 * nx)), 2) / 0.045);
            const coreGlow = Math.exp(-(Math.pow(x - 330, 2) / 48000 + Math.pow(y - 250, 2) / 26000));
            const rightAccent = Math.exp(-(Math.pow(x - 760, 2) / 65000 + Math.pow(y - 210, 2) / 32000));

            let r = 7 + 42 * band * (1 - nx * 0.4) + 88 * coreGlow + 24 * rightAccent;
            let g = 10 + 34 * band + 48 * coreGlow + 62 * rightAccent;
            let b = 18 + 85 * band + 115 * coreGlow + 135 * rightAccent;

            // Hero 4-point diffraction star on left-center (safe from Play Store text overlays)
            if (insideStar(x, y, 310, 250, 96, 13)) {
              return [248, 250, 252];
            }
            // Secondary companion star on right
            if (insideStar(x, y, 760, 205, 54, 8)) {
              return [224, 242, 254];
            }

            for (let i = 0; i < stars.length; i++) {
              const st = stars[i];
              const d = Math.hypot(x - st.x, y - st.y);
              if (d <= st.rad + 1.2) {
                const falloff = Math.max(0, 1 - d / (st.rad + 1.2));
                const boost = falloff * falloff * 235;
                r += boost * (st.tint > 0.7 ? 1.0 : 0.85);
                g += boost * 0.92;
                b += boost * (st.tint < 0.35 ? 1.0 : 0.88);
              }
            }

            return [
              Math.min(255, Math.round(r)),
              Math.min(255, Math.round(g)),
              Math.min(255, Math.round(b))
            ];
          });
          '

      - name: Upload Play Store Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Play-Store-Graphics
          path: store-assets/
          if-no-files-found: error
