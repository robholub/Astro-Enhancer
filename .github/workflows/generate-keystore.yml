name: Generate Permanent Keystore

on:
  workflow_dispatch:

jobs:
  make_keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate and Encode Keystore
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore release.keystore \
            -alias astrokey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=AstroEnhancer, OU=Astro, O=AstroEnhancer, L=Earth, S=Space, C=US"
          echo "=== COPY EVERYTHING BELOW THIS LINE ==="
          base64 -w 0 release.keystore
          echo ""
          echo "=== COPY EVERYTHING ABOVE THIS LINE ==="
